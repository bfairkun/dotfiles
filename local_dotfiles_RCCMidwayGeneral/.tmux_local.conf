# [ref: HPC POPUPS] prefix+j >> slurm job monitor  (scrollable; q to close)
# The viewer does its own paging: a tmux popup has no copy-mode and forwards every key
# straight to the program. Keys are listed in the popup's footer. Script lives in the
# general `bin` package because both slurm clusters need it.
bind-key j display-popup -E -w 90% -h 80% "~/bin/squeue_monitor"
