name: py_general
# Installation note (UMich Great Lakes / memory-constrained login nodes):
#   conda env create is killed during solving (4 GB cgroup limit on login nodes).
#   Use micromamba instead — much lower memory for the same solve:
#     ~/bin/micromamba env create -f py_general.yaml --yes
#   Install micromamba if needed (single binary, no conda required):
#     curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj -C ~/bin/ --strip-components=1 bin/micromamba
#   The pip section triggers a second solve pass; strip it from a temp copy and pip install afterward if needed.
channels:
  - conda-forge
  - bioconda
  - r
dependencies:
  # Jupyter / notebook
  - jupyterlab
  - jupyter
  - ipykernel
  - ipython
  - ipywidgets
  - nbconvert
  - nbformat
  - nbclient
  - papermill

  # Core scientific
  - numpy
  - pandas
  - scipy
  - matplotlib
  - scikit-image  # gel/blot densitometry (my_utils.gel_utils): rolling-ball background, regionprops, deskew
  - onnxruntime   # runs GelGenie's published U-Net ONNX exports without pulling in PyTorch
  - seaborn
  - plotnine
  - altair
  - bokeh
  - plotly

  # Data / IO
  - polars
  - pyarrow
  - openpyxl
  - xarray
  - dask

  # Stats / ML
  - scikit-learn
  - statsmodels
  - arviz=0.23       # keep <1: dose-response SQLite blobs and dr_helper_functions use the
                     # InferenceData API; arviz 1.x returns xarray DataTree instead
  - h5netcdf         # backend az.from_netcdf needs to open those blobs (HDF5/netCDF4)
  - pymc>=5.23,<6    # pymc 6 requires arviz>=1; blobs were written by pymc 5.23 (module pymc.yaml)
  - pip
  - pytensor
  # GPU+CPU in one env: CUDA builds of tensorflow/pytorch also run on CPU-only nodes.
  # Solve with `CONDA_OVERRIDE_CUDA=12.8` set (login/build nodes have no GPU, so the
  # solver otherwise silently picks cpu builds), on the `build` partition (login-node
  # solves get OOM-killed). Midway3 gpu nodes: V100 (sm70), driver 535 (native CUDA 12.2);
  # CUDA 12.x builds run via minor-version compat; CUDA 13 dropped sm70, so stay on 12.
  - cuda-version=12.*
  - tensorflow=*=cuda*
  - lightning          # OligoAI/RiNALMo: train_aso imports the unified `lightning`
                       # namespace; pytorch-lightning alone does NOT provide it
  - ml-collections     # rinalmo.config (conda-forge name is hyphenated)
  - einops             # rinalmo attention
  - pytorch=*=cuda*  # Angler (needs torch>=2.6,<3) and OligoAI
                     # OligoAI's checkpoint needs torch.serialization.add_safe_globals(
                     # [rinalmo.utils.scaler.StandardScaler, set]) under torch>=2.6.
  - triton           # Angler --backend fast_inference (GPU)
  - cuda-cudart-dev  # cuda.h: triton compiles a launcher at first GPU call and fails without it

  # Bioinformatics
  - biopython
  - dna_features_viewer  # GenBank/feature vector maps (built on biopython)
  - bedtools
  - pybedtools
  - pysam
  - pygenometracks
  - bedparse
  - pyfaidx
  - gffutils
  - pybigwig
  - bioconda::igv-reports
  - bioconda::spliceai
  - bioconda::htseq
  - bioconda::blast=2.16.0
  - bioconda::snakemake=7.32.4
  - bioconda::hgvs
  - bioconda::logomaker
  - bioconda::gseapy  # GO/pathway enrichment (ORA + GSEA); gp.enrich() supports custom background
  - bioconda::viennarna   # RNA secondary structure; RNAplfold accessibility for ASO target sites
  - bioconda::primer3-py  # hairpin/homodimer/heterodimer Tm — aso_tm only does the ASO:target duplex
  - pyranges              # pandas-native genomic intervals
  - intervaltree          # pure-python interval overlap (only dep: sortedcontainers)

  # Utilities
  - jinja2
  - pytest
  - tqdm
  - future
  - pycryptodome
  - ca-certificates
  - certifi
  - openssl
  - pyopenssl>=24  # avoid drift vs cryptography (X509_V_FLAG_NOTIFY_POLICY removed in cryptography>=42)
  - natsort
  - anndata
  - itables       # interactive sortable/filterable DataFrames in notebooks
  - adjusttext    # non-overlapping point labels in matplotlib
  - upsetplot     # set-intersection plots
  - watermark     # %watermark -iv to stamp package versions into a notebook

  - pip:
    # Editable install against the local clone, so edits to my_utils are picked up
    # without reinstalling. Path is machine-specific (RCC Midway shown); on a machine
    # with no clone, replace this line with the pinned `my-utils==0.1.0`.
    - -e /project/yangili1/bjf79/repos_not_projects/my_utils
    # Angler splice-site/branchpoint diGRU (private repo Rua76/angler_public, cloned
    # with `gh repo clone`). Editable against the local clone; torch comes from conda.
    - -e /project/yangili1/bjf79/repos_not_projects/angler_public
    - alphagenome==0.5.1
    - pikachu-chem==1.1.5

